[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diceware-phrase"
version = "0.5.0"
description = "Generate easy-to-remember passphrases from Diceware word lists."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Bjoern Albers" },
]
keywords = ["diceware", "passphrase", "password", "security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Utilities",
]

[project.optional-dependencies]
dev = ["build", "pytest", "twine"]
mnemonic = ["accelerate", "torch", "transformers>=4.51.0"]
llm = ["accelerate", "torch", "transformers>=4.51.0"]

[project.scripts]
phrase = "phrase.cli:main"

[project.urls]
Homepage = "https://github.com/bjoernalbers/phrase"
Repository = "https://github.com/bjoernalbers/phrase"
Issues = "https://github.com/bjoernalbers/phrase/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phrase = ["wordlists/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
